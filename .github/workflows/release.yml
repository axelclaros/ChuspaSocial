name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar paquetes
        run: |
          mkdir -p package/chuspasocial
          cp -r src/. package/chuspasocial/

      - name: Crear ZIP
        run: |
          cd package
          zip -r ../local_chuspasocial.zip chuspasocial

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: local_chuspasocial.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
